# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Anand Vijay Karuppiah
first_name: Anand Vijay
middle_name:
last_name: Karuppiah
email: avkaruppiah@gem-innovation.com
description: >
  Research Engineer specializing in physics-based simulation, digital twin development,
  and AI/ML-enabled engineering tools for aerospace and advanced manufacturing systems.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with
  <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords: computational mechanics, FEA, digital twin, multiphysics simulation, composite materials, residual stress, AI/ML, aerospace
lang: en
icon: ⚙️

url: https://AnandVijayKR.github.io
baseurl:
last_updated: true
back_to_top: true

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark
repo_trophies:
  enabled: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: false
bib_search: true
max_width: 960px

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

github_username: AnandVijayKR
linkedin_username: anand-vijay-karuppiah-17b44355
scholar_userid: VUabvsMAAAAJ

contact_note: >
  I welcome research collaboration and technical discussions in computational mechanics,
  digital twin development, and AI/ML-enabled engineering. Please reach out via email.

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Engineering Notes
blog_description: Reflections on simulation, physics, and engineering automation
permalink: /blog/:year/:title/
lsi: false

pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

announcements:
  enabled: true
  scrollable: true
  limit: 5

latest_posts:
  enabled: false
  scrollable: true
  limit: 3

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /:collection/:title/
  projects:
    output: true
    permalink: /:collection/:title/

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Karuppiah]
  first_name: [Anand, Anand Vijay, A.V.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: false
  dimensions: true
  google_scholar: true
  inspirehep: false

enable_publication_thumbnails: true

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: false
enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: true
enable_project_categories: true
enable_medium_zoom: true
enable_progressbar: true

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - README.md
  - vendor

keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-archives
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-toc
  - jemoji

sass:
  style: compressed

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
  output_formats:
    webp: "-quality 85"

lazy_loading_images: true

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
